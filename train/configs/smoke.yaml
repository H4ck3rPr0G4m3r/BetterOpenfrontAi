# Seconds-long end-to-end check: 2 workers, 2 seats, tiny rollouts.
run:
  name: smoke
  total_steps: 512
  checkpoint_every: 1
  device: auto

env:
  workers: 2
  seats: 2
  bots: 5
  nations: disabled
  tick_cap: 300

ppo:
  n_steps: 64
  epochs: 1
  minibatch: 64

selfplay:
  snapshot_every: 1
  active_opponents: 1
