# Curriculum stage 3: the full reference task. Same shape as the long
# haul, plus the troop-loss mute, observation normalization, and the
# long-horizon PPO settings from the 2M-step diagnosis.
env:
  map: World
  bots: 20
  nations: default
  ticks_per_step: 10
  tick_cap: 6000
  num_workers: 8
  envs_per_worker: 2
  strict_illegal_actions: true
  socket_timeout: 180.0
  parallel_workers: true
  seed: 0

behavior:
  aggression: 50
  disabled_intents: []
  disabled_builds: []
  reward_weights: [1.0, 0.1, 0.1, 2.0, -2.0, 0.5, 2.0, 2.0, 0.5, 0.5, 0.3, 0.0002, 0.5]
  troop_loss_scale: 0.0

ppo:
  n_steps: 512
  batch_size: 1024
  n_epochs: 4
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.02
  vf_coef: 0.5
  max_grad_norm: 0.5
  learning_rate: 0.0003

policy:
  features_dim: 512
  net_arch_pi: [256]
  net_arch_vf: [256]

run:
  total_timesteps: 100000
  checkpoint_freq: 25000
  checkpoint_dir: checkpoints/stage3full
  tensorboard_log: runs/stage3full
  run_name: ppo_stage3_full
  device: auto
  normalization:
    enabled: true
    clip: 5.0
  replay:
    dir: replays/stage3full
    every: 25
