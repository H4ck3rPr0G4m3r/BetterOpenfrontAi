# Main recipe: real in-game self-play on World with engine bots and nations.
# Every game seats 4 agents: seat 0 is the learner, each other seat is the
# live learner (50%) or a frozen snapshot from the opponent pool. Only
# learner seats are trained on. Curriculum: start without nations and with
# fewer bots, promote once 70% of learner episodes survive to the tick cap (and 200k steps in);
# then nations come in as a mix, already mostly Medium, more so at the
# end, so there is no single jump to all-Medium nations.
# Reward v3 and the v3 action rules (no donations, troop reserve, typed build
# sites, close spawns) come from the defaults in openfront/config.py.
run:
  name: selfplay_v3
  total_steps: 20000000
  checkpoint_every: 20
  replay: {dir: replays/selfplay, every: 20}  # one game in 20, over all workers

env:
  workers: 10
  games_per_worker: 1
  seats: 4
  bots: 20
  nations: default
  # 20 game minutes: long enough for an economy to pay off. Replays end
  # here too; evaluate.py plays full-length games (60 min by default).
  tick_cap: 12000
  close_spawn: 0.3

selfplay:
  learner_seat_prob: 0.5
  snapshot_every: 10
  pool_size: 24
  active_opponents: 4

curriculum:
  - {name: warmup, bots: 10, nations: disabled, promote: {survival: 0.7, min_episodes: 300, min_steps: 200000}}
  - {name: nations, bots: 20, nations: default, difficulty: {Easy: 1, Medium: 2},
     promote: {survival: 0.4, min_episodes: 100, min_steps: 300000, difficulty: Medium}}
  - {name: full, bots: 20, nations: default, difficulty: {Easy: 1, Medium: 3}}
