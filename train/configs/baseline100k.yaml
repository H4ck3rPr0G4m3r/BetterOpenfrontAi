# First connected baseline: default weights, working actions, 100k steps.
# Roughly 12-15 minutes wall clock at the measured throughput. Replays
# every 25th episode per env so the run stays watchable (~1-2 files/env).
env:
  map: World
  bots: 20
  ticks_per_step: 10
  tick_cap: 6000
  num_workers: 8
  envs_per_worker: 2
  strict_illegal_actions: true
  socket_timeout: 180.0
  parallel_workers: true
  seed: 0

behavior:
  aggression: 50
  disabled_intents: []
  disabled_builds: []
  reward_weights: null

ppo:
  n_steps: 128
  batch_size: 512
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  learning_rate: 0.0003

policy:
  features_dim: 512
  net_arch_pi: [256]
  net_arch_vf: [256]

run:
  total_timesteps: 100000
  checkpoint_freq: 25000
  checkpoint_dir: checkpoints/baseline100k
  tensorboard_log: runs/baseline100k
  run_name: ppo_100k_connected
  device: auto
  replay:
    dir: replays/baseline100k
    every: 25
